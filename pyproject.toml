[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "domestic-soul-sniper"
version = "0.1.0"
description = "Agent-assisted Fujifilm X-E3 monochrome (ACROS) photo pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
photo = "domestic_soul_sniper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
domestic_soul_sniper = ["py.typed"]
